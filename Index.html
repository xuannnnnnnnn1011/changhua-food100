        :root {

        * { box-sizing: border-box; font-family: 'Noto Sans TC', sans-serif; }
        body {
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 24px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 8px; font-size: 26px; }
        p.subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }
        .stats { font-size: 12px; color: #999; margin-bottom: 20px; font-weight: bold; }
        
        /* 篩選按鈕區 */
        .filter-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .filter-btn {
            background: #f0f2f5;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #444;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--secondary);
            color: white;
        }

        /* 推薦卡片 */
        .result-card {
            background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
            border: 2px solid #ffe3e3;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .result-card.bounce {
            animation: bounce 0.4s ease-in-out;
        }
        .shop-name { font-size: 24px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        .shop-tag { 
            display: inline-block; 
            background: #ffe3e3; 
            color: var(--primary); 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            margin: 0 auto 12px auto;
            font-weight: bold;
        }
        .shop-desc { color: #555; font-size: 15px; line-height: 1.6; margin: 0; text-align: left; text-indent: 2em; }

        /* 主按鈕 */
        .action-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3);
            transition: transform 0.1s, background 0.2s;
        }
        .action-btn:active { transform: scale(0.98); background: #ee5252; }

        @keyframes bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        let currentCategory = '全部';

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.innerText.includes(cat.replace('🥩 ','').replace('🍘 ','').replace('🍜 ','').replace('🍹 ','').replace('🎁 ','').replace('🎲 ',''))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            let count = 0;
            if(cat === '全部') {
                count = foodDatabase.length;
                document.getElementById('totalStats').innerText = `已載入 ${count} 間彰化在地精選美食`;
            } else {
                count = foodDatabase.filter(item => item.cat === cat).length;
                document.getElementById('totalStats').innerText = `【${cat}】口袋名單共 ${count} 間`;
            }
        }

        function drawFood() {
            let pool = [];
            
            if (currentCategory === '全部') {
                pool = foodDatabase;
            } else {
                pool = foodDatabase.filter(item => item.cat === currentCategory);
            }

            if(pool.length === 0) return;

            const randomShop = pool[Math.floor(Math.random() * pool.length)];
            
            const card = document.getElementById('resultCard');
            card.classList.remove('bounce');
            void card.offsetWidth; 
            card.classList.add('bounce');

            document.getElementById('shopName').innerText = randomShop.name;
            document.getElementById('shopDesc').innerText = randomShop.desc;
            document.getElementById('shopDesc').style.textAlign = 'left';
            document.getElementById('shopDesc').style.textIndent = '2em';
            
            const tag = document.getElementById('shopTag');
            tag.innerText = randomShop.cat;
            tag.style.display = 'inline-block';
        }
    </script>
